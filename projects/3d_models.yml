summary: >
  Python notebook and application to visualize and generate 3D models of geologic features using the PyVista library. This project includes examples of 3D models of Mt. St. Helens and other mountains.
description: >
  This project demonstrates how to use external data, such as USGS DEMs, and visualize them as hillshaded 3D models, in an interactive 3d viewer, and export the DEMs as STL suitable for 3D printing. The project includes a Python notebook and a Streamlit application that allows users to explore the 3D models of geologic features.
