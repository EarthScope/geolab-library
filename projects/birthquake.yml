summary: This widget lets you enter any date (your birthday!) and displays a map showing the largest 3 earthquakes worldwide on that day.
description: >
  Birthquake queries a global earthquake event service for a date you choose and plots the
  three largest earthquakes that occurred that day on an interactive map. It's a lightweight,
  no-code way to explore historical seismicity and see how event services can be wired up
  to a simple interactive widget.
