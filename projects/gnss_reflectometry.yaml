summary: This notebook provides an introduction to GNSS Interferometric Reflectometry using data from the NGF archive.
description: >
  This notebook introduces GNSS interferometric reflectometry (GNSS-IR), a technique that
  repurposes signal-to-noise ratio data from standard GNSS receivers to sense nearby surface
  properties such as snow depth, soil moisture, and water levels. It walks through pulling
  GNSS data from the NGF archive and computing a basic reflectometry estimate.
