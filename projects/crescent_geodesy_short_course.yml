summary: >
  These notebooks are from CRESCENT's Technical Short Course (TSC), "Strain Accumulation and Release from GNSS," offered June 15–17, 2026. They introduce GNSS time series processing, the use of forward and inverse elastic dislocation models to relate fault slip to geodetic displacements, and how rheological heterogeneity influences inferred fault slip patterns and surface deformation.
description: >
  The GNSS Data Processing and Fault Slip Modeling collection provides open-source educational resources and computational tools for exploring earthquake-cycle processes through geodetic observations. The materials were developed and presented by instructors from CRESCENT's Coupling, Seismicity, and Slow Slip (C3S) Working Group as part of CRESCENT's Technical Short Course program. The course, Strain Accumulation and Release from GNSS, was offered June 15–17, 2026. The collection includes Python-based Jupyter notebooks, instructional materials, and hands-on exercises that guide users through GNSS data processing and forward and inverse elastic dislocation modeling to relate fault slip to geodetic displacements. Users can explore different Earth models and investigate how elastic properties, rheological heterogeneity, and viscoelastic processes influence surface deformation, inferred fault slip patterns, and interpretations of earthquake-cycle behavior. These resources are intended to support students, researchers, and professionals working in geodesy, tectonics, and earthquake science, while providing adaptable examples that can be incorporated into research, teaching, and professional development.
