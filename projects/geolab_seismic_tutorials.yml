summary: These tutorials introduce users to core methods for accessing and processing seismic data from the NSF National Geophysical Facility Data Archive
description: >
  The tutorials use authentic seismic and computational tasks to build skills that can transfer
  across datasets and research workflows. Rather than teaching users to reproduce a single
  notebook or processing pipeline, the pathway progresses from accessing and exploring data to
  executing, adapting, and eventually scaling scientific workflows.


  Because seismic workflows can operate directly on waveform data in notebook-based
  environments, these notebooks emphasize data discovery and retrieval, data inspection and
  preparation, visualization, workflow execution, and analysis.

