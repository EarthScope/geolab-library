version: 1
extends:
 - https://raw.githubusercontent.com/EarthScope/CloudDocs/main/es_config/earthscope.yml
project:
  title: EarthScope Community Library
  copyright: '2024-2026'
  github: EarthScope/CommunityLibrary
  plugins:
    # {geolab-library} directive + the browser gallery widget.
    - plugins/geolab-library.mjs
    # Fills the gallery with projects/*.yml.
    - type: executable
      path: library_listing.py

  toc:
    - file: docs/welcome.md
    - file: project_tiles.md
    - file: docs/contributing.md
      title: Contributing to the Library
      children:
        - file: docs/notebook_guidelines.md
        - file: docs/image_guidelines.md
  

